[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meetingbot"
version = "0.1.0"
description = "Free self-hosted Google Meet recorder + bilingual (EN / AR-LB) note taker"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "MeetingBot" }]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "SQLAlchemy>=2.0",
]

[project.optional-dependencies]
stt = ["faster-whisper>=1.0"]
llm = ["google-genai>=0.3", "ollama>=0.3"]
calendar = [
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.2",
    "google-auth-httplib2>=0.2",
]
bot = ["playwright>=1.44"]
web = ["fastapi>=0.111", "uvicorn[standard]>=0.30", "jinja2>=3.1"]
pdf = ["weasyprint>=62"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "httpx>=0.27"]
all = [
    "faster-whisper>=1.0",
    "google-genai>=0.3",
    "ollama>=0.3",
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.2",
    "google-auth-httplib2>=0.2",
    "playwright>=1.44",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "weasyprint>=62",
]

[project.scripts]
meetingbot = "meetingbot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/meetingbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# typer uses function calls as argument defaults by design
"src/meetingbot/cli.py" = ["B008"]
